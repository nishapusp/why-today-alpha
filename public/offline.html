<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Why Today</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1a33;
        color: #ffffff;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .wrap { max-width: 360px; }
      h1 { font-size: 22px; margin-bottom: 8px; }
      p { color: #c7ceda; font-size: 15px; line-height: 1.5; }
      button {
        margin-top: 20px;
        padding: 10px 20px;
        background: #ffffff;
        color: #0b1a33;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>You're offline</h1>
      <p>Why Today needs a connection to fetch today's stories. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
