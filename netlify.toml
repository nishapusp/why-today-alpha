[build]
  # 2026-08-02: added after a Netlify credit-usage investigation found
  # that pushes carrying ONLY internal pipeline bookkeeping — never read
  # by the live app at runtime — were still triggering full production
  # deploys. data/rss-watch.json is poll-rss.js's own polling state;
  # data/verification/ holds fact-check reports. Neither is imported or
  # fetched by anything in app/, components/, or lib/ (confirmed by
  # search before adding this).
  #
  # `git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!path' ...`
  # exits 0 (no differences) when every changed file falls under an
  # excluded pathspec, and exits non-zero the moment anything OUTSIDE
  # those paths changed. Netlify's own convention for this "ignore"
  # command is the same: exit 0 skips the build, non-zero proceeds —
  # so this skips a build/deploy only when the push touched nothing but
  # these two ignorable paths, and still builds normally for every real
  # content or code change. Verified locally against real commit history
  # in both directions (a poll-rss-only commit correctly exits 0; a
  # "Daily edition" content commit correctly exits 1) before adding this.
  #
  # This is a build-time skip only — it does not change what generates,
  # runs on schedule, or commits to git; the underlying poll-rss.js
  # retrigger-loop and cooldown fixes (same investigation) address the
  # push volume itself. This is a second, independent layer: even if some
  # future workflow starts pushing bookkeeping-only changes again, those
  # pushes won't cost a deploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!data/rss-watch.json' ':!data/verification'"
