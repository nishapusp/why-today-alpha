name: Generate Daily Edition 
concurrency:
  group: generate-edition
  cancel-in-progress: false

on:
  # Tap "Run workflow" here, or from the GitHub mobile app (Actions tab)
  workflow_dispatch:
    inputs:
      focus_category:
        description: "Optional: bias this batch toward a category (e.g. World) that's under-represented today. Leave blank for normal behavior."
        required: false
        default: ""

  # Trimmed from 4 runs/day to 2 (2026-07-13) — the 4-run schedule was
  # quietly self-defeating. Gemini's free-tier daily quota resets on a
  # FIXED CLOCK TIME (midnight Pacific = ~12:30 PM IST), not per-run and
  # not on a rolling basis. Under the old schedule, the 1 PM/4 PM/8:30 PM
  # runs all drew from the SAME quota bucket that opens at 12:30 PM IST —
  # and so did the NEXT DAY's morning run, since it's still hours before
  # the following reset. So the "safety net" top-ups were spending
  # tomorrow morning's quota tonight, which is exactly backwards for a
  # product whose main readership arrives early.
  #
  # Moved from 6 AM to 5 AM IST (2026-07-29) — scheduled GitHub Actions
  # triggers on this repo have repeatedly landed 2-3+ hours late (and
  # some days not at all), so an hour of buffer gives it more room to
  # actually land before readers show up, without changing anything else
  # about the quota timing below (5 AM IST is still hours before the
  # ~12:30 PM IST reset, same as 6 AM was).
  #
  # One run right at 5 AM (fresh bucket, minus whatever leaked from the
  # previous day — should be ~nothing since nothing else fires
  # overnight), and exactly one top-up at 1:15 PM — 45 minutes AFTER the
  # ~12:30 PM IST reset, so it always gets a clean bucket rather than
  # competing with the morning run. generate-edition.js exits immediately
  # if the day's target is already met, so the 1:15 PM run costs nothing
  # on a day the 5 AM run already finished.
  # Cron is in UTC:
  #   5:00 AM IST  = 23:30 UTC (previous day)
  #   1:15 PM IST  = 07:45 UTC  (quota resets ~07:00 UTC / 12:30 PM IST)
  schedule:
    - cron: "30 23 * * *"
    - cron: "45 7 * * *"

permissions:
  contents: write # needed so the script can git push the updated edition.json

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git identity
        run: |
          git config user.name "Why Today Bot"
          git config user.email "actions@github.com"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Generate today's edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Back to 15 (was temporarily 9) — the free-tier quota exhaustion
          # was caused by a since-fixed bug (responseMimeType + google_search
          # tool conflict) that made every attempt fail and retry, burning
          # 10-15 calls/day for zero output. A clean run now costs 5 calls
          # (5 batches x 1 call), comfortably inside the free tier. If quota
          # errors come back on a NORMAL run (not every batch instantly
          # failing), drop this back to 9 or enable billing.
          STORY_TARGET: "15"
          # 2026-07-17: reduced from 8 — a real run hit "Unexpected end of
          # JSON input" on ALL 3 retry attempts (same failure every time,
          # not random bad luck), right after switching from a retired
          # model to gemini-2.5-flash. Grounded calls moved to the Gemini
          # 2.5 family the day before (fixing the 0/0 grounding quota
          # issue) — that model's real maxOutputTokens ceiling isn't
          # confirmed the way gemini-3.5-flash's 65536 was, so requesting
          # 8*6500+2000=54000 tokens may simply exceed what it can return,
          # producing a truncated/unparseable response every single time
          # regardless of retries. Smaller batches need less total output
          # per call, which is a robust mitigation regardless of the exact
          # ceiling. Revisit upward if a run completes cleanly at this size.
          BATCH_SIZE: "5"
          # Slightly wider than the default 15s now that we're pushing more
          # batches/day — extra margin against the 5-requests/minute cap.
          BATCH_SPACING_MS: "20000"
          FOCUS_CATEGORY: ${{ github.event.inputs.focus_category }}
          # 2026-07-26: defers this script's own push until the workflow's
          # final step below, after verification has also had a chance to
          # commit its changes — see that step and generate-edition.js's
          # pushPending() for the full reasoning. Combines what used to be
          # two separate deploys (one for generation, one for verification)
          # into one, without skipping or weakening verification itself.
          SKIP_INTERNAL_PUSH: "1"
        run: node scripts/generate-edition.js

      # 2026-07-21: added after a real report showed the actual gap in
      # this whole system — verify-edition.js was sophisticated and
      # genuinely catching problems (a real run found fabricated content
      # in most of a day's stories), but was ONLY ever manually triggered
      # and its findings never affected what was actually published.
      # Runs in "source" mode specifically — fetches each story's own
      # cited sources directly, ZERO grounding quota used, so this is
      # safe to run automatically after every single generation without
      # competing with the scarce grounding budget the generation step
      # itself needs. --auto-remove pulls any FAIL/FABRICATED story, plus
      # any WARN story with 3+ unverifiable claims (see verify-edition.js
      # for the full reasoning on that threshold). continue-on-error:
      # true because a verification hiccup (a source site down, a
      # transient API error) should not block the edition that already
      # published successfully — worst case, a bad story stays live
      # until the next manual verify catches it, same as before this
      # existed; that's a regression to the OLD behavior, not a new
      # failure mode.
      # 2026-07-27: if: success() -> if: always() — a real run made
      # genuine progress (10/15 stories, 3 valid batches committed
      # locally) but exited non-zero because it was PARTIAL (quota ran
      # out), which is correct/by-design for the script itself. But
      # success() treated that as "the previous step failed," skipping
      # this step AND the push step below entirely — meaning all 10 real
      # stories got generated, staged locally, and then discarded when
      # the runner shut down, never reaching Netlify at all. always()
      # runs regardless, so a partial run's real progress still gets
      # checked and pushed rather than lost outright.
      - name: Fact-check and remove any fabricated stories
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/verify-edition.js --mode source --auto-remove

      # 2026-07-26: renamed and fixed — this used to exit early ("No changes
      # from fact-check") whenever verification itself found nothing to
      # remove, which is fine on its own EXCEPT this step is now also
      # responsible for pushing generation's own commits (deferred via
      # SKIP_INTERNAL_PUSH above, to combine what used to be two separate
      # deploys into one). Exiting early on "verification made no changes"
      # would have silently stranded every day's stories on the runner,
      # never reaching Netlify, on any day verification didn't need to
      # remove anything — which is most days. Now: commit verification's
      # changes IF there are any, then always attempt a push regardless,
      # to flush whatever's pending (generation's commits, verification's
      # commit, or both).
      - name: Commit verification changes and push everything
        if: always()
        continue-on-error: true
        run: |
          git config user.name "why-today-bot"
          git config user.email "actions@github.com"
          git add data/edition.json data/verification/
          if git diff --cached --quiet; then
            echo "No changes from fact-check — still pushing generation's own pending commits."
          else
            git commit -m "chore(verify): auto-remove fabricated/unverifiable stories ($(date -u +%F))"
          fi
          for i in 1 2 3; do
            git push && break
            git pull --rebase && sleep 3
          done

      # Added 2026-07-15 for the Web Push feature — only runs if the
      # generate step above succeeded, so a failed/partial run never
      # notifies readers about stories that didn't actually publish.
      # v1 is deliberately generic (not featuring a specific headline) —
      # simple and reliable over clever for a first version.
      - name: Notify subscribers
        if: success()
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
        run: node scripts/send-push-notification.js "Why Today" "Today's edition is live — top banking, economy & finance stories, verified and explained." "/"

