name: Generate Daily Edition

on:
  # Tap "Run workflow" here, or from the GitHub mobile app (Actions tab)
  workflow_dispatch: {}

  # Runs three times a day so a run that stops early (rate limits, a bad
  # batch) gets topped up later the same day instead of staying incomplete
  # until tomorrow. generate-edition.js resumes automatically — a run that
  # finds the day's target already met just exits immediately, so these
  # extra triggers cost nothing when the morning run already finished.
  # Cron is in UTC:
  #   6:00 AM IST  = 00:30 UTC
  #   1:00 PM IST  = 07:30 UTC
  #   4:00 PM IST  = 10:30 UTC
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 7 * * *"
    - cron: "30 10 * * *"

permissions:
  contents: write # needed so the script can git push the updated edition.json

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git identity
        run: |
          git config user.name "Why Today Bot"
          git config user.email "actions@github.com"

      - name: Generate today's edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # 9 stories for now (was 15) — comfortably inside the Gemini
          # free-tier daily quota. Raise this back up once billing is on.
          STORY_TARGET: "9"
        run: node scripts/generate-edition.js

