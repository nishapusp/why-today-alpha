name: Regenerate Story
concurrency:
  group: regenerate-story
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      slug_or_mode:
        description: "Either an existing story's slug (to replace it), or --new (to add a brand new story alongside the existing ones instead)"
        required: true
      feedback_or_topic:
        description: "If replacing: what to fix/change. If --new: the topic description (e.g. 'Union Bank Q1 FY27 results — full deep dive with peer comparison')"
        required: false
        default: ""

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git identity
        run: |
          git config user.name "Why Today Bot"
          git config user.email "actions@github.com"

      - name: Regenerate or add story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_CONFIRM: "1"
        run: node scripts/regenerate-story.js "${{ github.event.inputs.slug_or_mode }}" "${{ github.event.inputs.feedback_or_topic }}"
