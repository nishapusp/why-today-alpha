name: Regenerate Story
concurrency:
  group: regenerate-story
  cancel-in-progress: false

# 2026-07-16: this was missing entirely — a real run generated a full,
# valid story (810-word deep dive, written to the file locally) and then
# failed at the very last step: "Write access to repository not
# granted... 403". GitHub Actions' auto-injected GITHUB_TOKEN defaults to
# read-only unless a workflow explicitly declares write access, which
# this file never did (unlike generate-edition.yml and poll-rss.yml,
# both of which already have this same block and push successfully).
permissions:
  contents: write # needed so the script can git push the new/regenerated story

on:
  workflow_dispatch:
    inputs:
      slug_or_mode:
        description: "Either an existing story's slug (to replace it), or --new (to add a brand new story alongside the existing ones instead)"
        required: true
      feedback_or_topic:
        description: "If replacing: what to fix/change. If --new: the topic description (e.g. 'Union Bank Q1 FY27 results — full deep dive with peer comparison')"
        required: false
        default: ""

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git identity
        run: |
          git config user.name "Why Today Bot"
          git config user.email "actions@github.com"

      - name: Regenerate or add story
        id: regenerate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AUTO_CONFIRM: "1"
          # 2026-07-26: defers this script's own push — see that env var's
          # handling in regenerate-story.js and the final workflow step
          # below for the full reasoning (combines what used to be two
          # deploys per regeneration into one).
          SKIP_INTERNAL_PUSH: "1"
        run: node scripts/regenerate-story.js "${{ github.event.inputs.slug_or_mode }}" "${{ github.event.inputs.feedback_or_topic }}"

      # 2026-07-22: closes the loop after a real report that regenerating
      # a story to fix one wrong number produced a different wrong number
      # instead — this runs the fact-checker against exactly the story
      # that was just changed, in quota-free "source" mode (fetches the
      # story's own cited sources directly, no grounding quota used), so
      # a bad regeneration is caught immediately rather than assumed
      # correct. Doesn't auto-remove here (unlike generate-edition.yml) —
      # a human just deliberately made this specific change and should
      # see the verdict before anything gets auto-reverted.
      - name: Fact-check the regenerated story
        if: success() && steps.regenerate.outputs.slug != ''
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/verify-edition.js --mode source --slugs "${{ steps.regenerate.outputs.slug }}"

      # 2026-07-26: renamed and fixed — used to exit early when
      # verification made no report changes, which would have stranded
      # the regeneration's own commit (now deferred via SKIP_INTERNAL_PUSH
      # above) on the runner instead of pushing it. Always pushes now,
      # combining what used to be two deploys per regeneration into one.
      - name: Commit verification report and push everything
        if: success()
        continue-on-error: true
        run: |
          git config user.name "why-today-bot"
          git config user.email "actions@github.com"
          git add data/edition.json data/verification/
          if git diff --cached --quiet; then
            echo "No new changes to commit — still pushing any pending commits."
          else
            git commit -m "chore(verify): fact-check regenerated story ($(date -u +%F))"
          fi
          for i in 1 2 3; do
            git push && break
            git pull --rebase && sleep 3
          done
