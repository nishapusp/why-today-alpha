name: Generate Quick Reads
concurrency:
  group: generate-quick-reads
  cancel-in-progress: false

on:
  # Tap "Run workflow" here, or from the GitHub mobile app (Actions tab)
  workflow_dispatch:

  # UPDATED 2026-07-15 (second pass): this run now DOES touch Gemini
  # quota — enrichWithSummaries() in generate-quick-reads.js adds one
  # batched, ungrounded LLM call per run to write real Inshorts-style
  # blurbs and smarter image-search queries (the original zero-LLM
  # design was too thin/duplicate-of-headline too often in practice).
  # Still doesn't touch Netlify deploy credits (writes to Blobs, not a
  # committed file). Reduced from every 20 min to every 60 min
  # specifically to bound this new quota exposure to something modest
  # and predictable (24 calls/day) rather than unbounded (72/day) —
  # the enrichment call is ungrounded so it's cheap per-call, but it's
  # still a new draw on the same free-tier daily REQUEST budget the
  # flagship pipeline has been fighting all session. Revisit this
  # cadence if actual daily quota usage (watch the flagship pipeline's
  # own logs for 429s) suggests it needs to come down further.
  # 2026-07-16: reverted from every 20 min back to hourly, ahead of the
  # repo going private. Every-20-min (72 runs/day) was fine on Gemini
  # quota after the model rebalancing fix, but GitHub Actions minutes are
  # a SEPARATE budget — private repos get 2,000 free minutes/month
  # shared across every workflow in the repo, and at ~45-75s/run (npm
  # install + RSS fetch + Gemini call + Blobs write), 72 runs/day alone
  # could be ~2,000+ min/month — potentially the entire private-repo
  # budget from this one workflow, before the flagship pipeline, the
  # feedback digest, or any manual regenerations.
  #
  # 2026-08-05: reduced again, hourly -> every 3 hours (24/day -> 8/day).
  # This shares the EXACT same Gemini quota pool (MODEL/FALLBACK_MODEL,
  # imported straight from generate-edition.js) as the flagship pipeline's
  # own ungrounded verification calls — the pool that hit
  # GenerateRequestsPerDayPerProjectPerModel-FreeTier and stopped
  # generation outright on 2026-08-04/05. This workflow fires on its own
  # clock regardless of how much quota the flagship pipeline has already
  # used that day, so cutting it to 8/day meaningfully lowers how much of
  # the shared daily budget a secondary, nice-to-have feed can consume
  # before the flagship edition itself gets a turn.
  schedule:
    - cron: "0 */3 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Generate Quick Reads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          QUICK_READS_LIMIT: "40"
        run: node scripts/generate-quick-reads.js

      # 2026-07-17: only notifies when the top story is BOTH new and
      # corroborated by 2+ outlets — NOT on every hourly run, which
      # would be exactly the over-notifying pattern that gets push
      # permission revoked. See notify-quick-reads.js for the actual
      # gating logic.
      - name: Notify about major new Quick Reads
        if: success()
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
        run: node scripts/notify-quick-reads.js
