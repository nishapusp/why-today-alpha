name: Generate Quick Reads
concurrency:
  group: generate-quick-reads
  cancel-in-progress: false

on:
  # Tap "Run workflow" here, or from the GitHub mobile app (Actions tab)
  workflow_dispatch:

  # UPDATED 2026-07-15 (second pass): this run now DOES touch Gemini
  # quota — enrichWithSummaries() in generate-quick-reads.js adds one
  # batched, ungrounded LLM call per run to write real Inshorts-style
  # blurbs and smarter image-search queries (the original zero-LLM
  # design was too thin/duplicate-of-headline too often in practice).
  # Still doesn't touch Netlify deploy credits (writes to Blobs, not a
  # committed file). Reduced from every 20 min to every 60 min
  # specifically to bound this new quota exposure to something modest
  # and predictable (24 calls/day) rather than unbounded (72/day) —
  # the enrichment call is ungrounded so it's cheap per-call, but it's
  # still a new draw on the same free-tier daily REQUEST budget the
  # flagship pipeline has been fighting all session. Revisit this
  # cadence if actual daily quota usage (watch the flagship pipeline's
  # own logs for 429s) suggests it needs to come down further.
  # 2026-07-16: tightened from hourly to every 20 min — the model
  # rebalancing fix (see generate-quick-reads.js) means this now defaults
  # to gemini-3.1-flash-lite (500 requests/day free tier) rather than the
  # 20/day model, so even at 20-min cadence (72 runs/day) there's
  # comfortable headroom left for everything else sharing that budget.
  # Started here rather than 15 min (96 runs/day, also fine on paper) to
  # leave a bit more margin while confirming real usage looks healthy —
  # tighten further once that's confirmed. The other real constraint is
  # GitHub Actions' own minute budget if this repo is private (2,000
  # free/month) — public repos aren't limited this way.
  schedule:
    - cron: "*/20 * * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Generate Quick Reads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          QUICK_READS_LIMIT: "40"
        run: node scripts/generate-quick-reads.js
